<div class="container mt-4 mb-5">
  <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
    
    <!-- Cabeçalho -->
     <div class="title-banner d-flex align-items-center justify-content-between p-3 text-white position-relative">
      <div class="z-2">
        <h4 class="fw-bold m-0 display-12">Análise Estatística dos dados Cadastrados</h4>
        <p class="mb-0 opacity-85 mt-1 d-none d-sm-block">Escolha um tema para visualizar a distribuição dos familiares</p>
      </div>

    </div>

    <!-- Corpo com Grid Responsivo -->
    <div class="card-body p-4 bg-white">
      <div class="row g-4 align-items-center">
        
        <!-- Coluna Esquerda: Filtro e Informações -->
        <div class="col-12 col-md-5 col-lg-4">
          <div class="p-3 bg-light rounded-3 border border-light-subtle mb-3">
            <label class="form-label small fw-semibold text-secondary mb-2">Selecione o Indicador</label>
            <!-- Dropdown Moderno PrimeNG -->
            <p-select 
              [options]="temas" 
              [(ngModel)]="temaSelecionado" 
              optionLabel="label" 
              optionValue="value" 
              styleClass="w-100 custom-select">
            </p-select>
          </div>

          <!-- Card de Resumo Numérico Embaixo -->
          <div class="p-3 bg-primary-subtle text-primary rounded-3 border border-primary-subtle">
            <div class="d-flex align-items-center gap-2">
              <i class="pi pi-users fs-4"></i>
              <div>
                <span class="small d-block opacity-75">Amostragem Atual</span>
                <h4 class="fw-bold m-0">{{ integrantes().length }} Integrantes</h4>
              </div>
            </div>
          </div>
        </div>

        <!-- Coluna Direita: O Gráfico Rendereizado -->
        <div class="col-12 col-md-7 col-lg-8 text-center">
          <div class="chart-container d-flex justify-content-center align-items-center" style="position: relative; height: 320px; width: 100%;">
            
            <!-- Componente de Gráfico Reativo PrimeNG -->
            <p-chart 
              type="doughnut" 
              [data]="chartData()" 
              [options]="chartOptions" 
              style="width: 100%; max-width: 360px;">
            </p-chart>

          </div>
        </div>

      </div>
    </div>

  </div>
</div>
